<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nivaan's Toddler Tracker</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Track Nivaan's daily routine with real-time sync and family sharing">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nivaan">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            color: #0f172a;
        }
        
        .app-gradient {
            background: radial-gradient(circle at top right, #818cf8, #6366f1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .active-ring {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .timeline-line::before {
            content: '';
            position: absolute;
            left: 28px;
            top: 40px;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
            z-index: 0;
        }

        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-active {
            color: #6366f1;
            transform: translateY(-4px);
        }

        .fade-up {
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-soft {
            animation: pulseSoft 2s infinite;
        }

        @keyframes pulseSoft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-32">

    <!-- Top Status Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 px-6 pt-4 pb-2 bg-slate-50/80 backdrop-blur-md flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full app-gradient flex items-center justify-center text-white text-[10px] font-bold shadow-lg shadow-indigo-200">N</div>
            <span id="live-date" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Loading...</span>
        </div>
        <div class="flex items-center gap-3">
            <span id="live-clock" class="text-sm font-extrabold tracking-tighter text-slate-800">00:00</span>
            <div id="firebase-status" class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-6 pt-20">
        
        <!-- Hero Tracking Card -->
        <div id="focus-card" class="app-gradient rounded-[2.5rem] p-7 text-white shadow-2xl shadow-indigo-200 relative overflow-hidden fade-up">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            
            <div class="relative z-10">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <p id="focus-label" class="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-100 mb-1">Live Tracking</p>
                        <h2 id="focus-task" class="text-2xl font-extrabold tracking-tight">Syncing...</h2>
                    </div>
                    <div id="focus-icon-container" class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-xl">
                        <i id="focus-icon" class="fa-solid fa-clock"></i>
                    </div>
                </div>
                
                <p id="focus-detail" class="text-sm text-indigo-50 font-medium opacity-90 mb-6 line-clamp-1">Preparing Nivaan's schedule...</p>
                
                <div class="space-y-2">
                    <div class="flex justify-between items-end">
                        <span class="text-[10px] font-bold uppercase text-indigo-100">Daily Completion</span>
                        <span id="progress-text" class="text-lg font-black tracking-tighter">0%</span>
                    </div>
                    <div class="w-full bg-black/10 rounded-full h-3 p-1 overflow-hidden">
                        <div id="progress-bar" class="bg-white h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Glance Grid -->
        <div class="grid grid-cols-2 gap-4 mt-6 fade-up" style="animation-delay: 0.1s">
            <div class="glass-card rounded-[2rem] p-5">
                <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-500 flex items-center justify-center mb-3">
                    <i class="fa-solid fa-bottle-water text-xs"></i>
                </div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Total Milk</p>
                <p class="text-lg font-extrabold text-slate-800">~500ml</p>
            </div>
            <div class="glass-card rounded-[2rem] p-5">
                <div class="w-8 h-8 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center mb-3">
                    <i class="fa-solid fa-flask text-xs"></i>
                </div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Ratio (F/B)</p>
                <p class="text-lg font-extrabold text-slate-800">100/60</p>
            </div>
        </div>

        <!-- Views Container -->
        <div id="view-container" class="mt-8 mb-20 fade-up" style="animation-delay: 0.2s">
            
            <!-- Timeline View -->
            <div id="view-routine" class="relative timeline-line space-y-6">
                <div id="loader" class="text-center py-10 opacity-50">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
                <div id="routine-list" class="space-y-8"></div>
            </div>

            <!-- Events View -->
            <div id="view-logs" class="hidden space-y-6">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="addLog('💩 Diaper')" class="p-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2 transition-active active:scale-95">
                        <i class="fa-solid fa-poop text-amber-600 text-lg"></i>
                        <span class="text-[10px] font-bold uppercase">Diaper</span>
                    </button>
                    <button onclick="addLog('💊 Meds')" class="p-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2 transition-active active:scale-95">
                        <i class="fa-solid fa-pills text-rose-500 text-lg"></i>
                        <span class="text-[10px] font-bold uppercase">Meds</span>
                    </button>
                    <button onclick="addLog('🍎 Snack')" class="p-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2 transition-active active:scale-95">
                        <i class="fa-solid fa-apple-whole text-emerald-500 text-lg"></i>
                        <span class="text-[10px] font-bold uppercase">Snack</span>
                    </button>
                    <button onclick="addLog('🏥 Health')" class="p-4 bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col items-center gap-2 transition-active active:scale-95">
                        <i class="fa-solid fa-heart-pulse text-indigo-500 text-lg"></i>
                        <span class="text-[10px] font-bold uppercase">Health</span>
                    </button>
                </div>
                <div id="log-list" class="space-y-3"></div>
            </div>

            <!-- Settings View -->
            <div id="view-settings" class="hidden space-y-4">
                <div class="glass-card rounded-[2rem] p-6">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4">Cloud Status</h3>
                    <div class="flex items-center justify-between py-3 border-b border-slate-100">
                        <span class="text-sm font-bold text-slate-700">Syncing</span>
                        <span id="fb-status-text" class="text-xs font-black text-indigo-600">Active</span>
                    </div>
                    <div class="flex items-center justify-between py-3">
                        <span class="text-sm font-bold text-slate-700">Device ID</span>
                        <span id="device-id" class="text-[10px] font-mono text-slate-400">Loading...</span>
                    </div>
                </div>
                <button onclick="confirmReset()" class="w-full py-5 rounded-[2rem] bg-rose-50 text-rose-600 font-bold text-sm border border-rose-100 transition-active active:scale-95">
                    <i class="fa-solid fa-trash-can mr-2"></i> Reset Today's Progress
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-2xl border-t border-slate-100 px-8 pt-4 bottom-nav shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="switchTab('routine')" id="nav-routine" class="flex flex-col items-center gap-1 transition-all tab-active">
                <i class="fa-solid fa-house-user text-xl"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="switchTab('logs')" id="nav-logs" class="flex flex-col items-center gap-1 transition-all text-slate-400">
                <i class="fa-solid fa-notes-medical text-xl"></i>
                <span class="text-[10px] font-bold">Events</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 transition-all text-slate-400">
                <i class="fa-solid fa-gear text-xl"></i>
                <span class="text-[10px] font-bold">Settings</span>
            </button>
        </div>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 left-6 right-6 z-[60] glass-card rounded-2xl p-4 flex items-center justify-center text-xs font-bold text-indigo-600 border-indigo-100 opacity-0 pointer-events-none transition-all duration-300">
        Syncing...
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Config & Routine Data ---
        // Safeguard global variables provided by the environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "", projectId: "" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nivaan-toddler-tracker';

        const routineData = [
            { id: 0, time: "06:00", label: "06:00 AM", task: "Wake Up", detail: "Morning Activity & Play", icon: "fa-sun" },
            { id: 1, time: "07:30", label: "07:30 AM", task: "Breakfast + Milk 1", detail: "Cereal + Banana | 160-180ml", icon: "fa-utensils" },
            { id: 2, time: "09:30", label: "09:30 AM", task: "Nap 1", detail: "Sleep (~1.5 Hours)", icon: "fa-moon" },
            { id: 3, time: "12:00", label: "12:00 PM", task: "Lunch", detail: "Chicken + Broccoli + Rice", icon: "fa-bowl-food" },
            { id: 4, time: "14:30", label: "02:30 PM", task: "Nap 2", detail: "End by 4:00 PM", icon: "fa-bed" },
            { id: 5, time: "16:30", label: "04:30 PM", task: "Milk Feed 2", detail: "Milk (160ml)", icon: "fa-bottle-water" },
            { id: 6, time: "19:00", label: "07:00 PM", task: "Dinner", detail: "Soft Family Food (1/2 Cup)", icon: "fa-plate-wheat" },
            { id: 7, time: "20:30", label: "08:30 PM", task: "Bed Prep + Milk 3", detail: "Milk (160ml)", icon: "fa-bottle-water" },
            { id: 8, time: "21:00", label: "09:00 PM", task: "Night Sleep", detail: "Goal: 9 Hours Straight", icon: "fa-star" }
        ];

        let activeDate = new Date().toISOString().split('T')[0];
        let currentChecks = {};

        // --- Auth & Realtime Sync ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth failed:", error);
                showToast("Connection failed. Please refresh.");
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const loader = document.getElementById('loader');
                if (loader) loader.classList.add('hidden');
                
                const deviceIdEl = document.getElementById('device-id');
                if (deviceIdEl) deviceIdEl.innerText = user.uid.substring(0, 12) + "...";
                
                updateStatusBadge(true);
                setupRealtimeSync();
            }
        });

        function setupRealtimeSync() {
            if (!auth.currentUser) return;
            
            // CORRECTED: Fixed document segments (6 segments is even)
            const statusDoc = doc(db, 'artifacts', appId, 'public', 'data', 'dailyRoutines', activeDate);
            onSnapshot(statusDoc, (snapshot) => {
                currentChecks = snapshot.data()?.checks || {};
                updateUI();
            }, () => updateStatusBadge(false));

            const logsCol = collection(db, 'artifacts', appId, 'public', 'data', 'logs_' + activeDate);
            onSnapshot(logsCol, (snapshot) => {
                const logs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                    .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                renderLogs(logs);
            });
        }

        // --- App Interactions ---
        window.toggleTask = async (id) => {
            if (!auth.currentUser) return;
            updateStatusBadge(true, 'syncing');
            // CORRECTED: Fixed document segments
            const statusDoc = doc(db, 'artifacts', appId, 'public', 'data', 'dailyRoutines', activeDate);
            const newChecks = { ...currentChecks };
            newChecks[id] = !newChecks[id];
            await setDoc(statusDoc, { checks: newChecks }, { merge: true });
            updateStatusBadge(true);
        };

        window.addLog = async (text) => {
            if (!auth.currentUser) return;
            const logsCol = collection(db, 'artifacts', appId, 'public', 'data', 'logs_' + activeDate);
            await addDoc(logsCol, { text, timestamp: serverTimestamp(), user: auth.currentUser.uid });
            showToast("Logged: " + text);
        };

        window.confirmReset = async () => {
            if (!confirm("Wipe all progress for today?")) return;
            // CORRECTED: Fixed document segments
            const statusDoc = doc(db, 'artifacts', appId, 'public', 'data', 'dailyRoutines', activeDate);
            await setDoc(statusDoc, { checks: {} });
            showToast("Progress reset");
        };

        // --- Render Logic ---
        function updateUI() {
            const now = new Date();
            const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            let focusIndex = -1;
            for (let i = 0; i < routineData.length; i++) {
                if (currentHM >= routineData[i].time) focusIndex = i;
            }

            const currentTask = focusIndex >= 0 ? routineData[focusIndex] : null;
            const nextTask = routineData.find((item, idx) => idx > focusIndex && !currentChecks[item.id]);
            const isCurrentDone = currentTask ? !!currentChecks[currentTask.id] : false;

            const focusEl = document.getElementById('focus-task');
            const focusDetail = document.getElementById('focus-detail');
            const focusLabel = document.getElementById('focus-label');
            const focusIcon = document.getElementById('focus-icon');

            if (currentTask && !isCurrentDone) {
                focusLabel.innerText = "Current Task";
                focusEl.innerText = currentTask.task;
                focusDetail.innerText = currentTask.detail;
                focusIcon.className = `fa-solid ${currentTask.icon}`;
            } else if (nextTask) {
                focusLabel.innerText = "Up Next";
                focusEl.innerText = nextTask.task;
                focusDetail.innerText = "Starts at " + nextTask.label;
                focusIcon.className = `fa-solid ${nextTask.icon}`;
            } else {
                focusLabel.innerText = "Day Complete";
                focusEl.innerText = "Great work!";
                focusDetail.innerText = "Nivaan is all set for tonight.";
                focusIcon.className = "fa-solid fa-moon";
            }

            renderRoutineList(currentChecks, focusIndex);
            updateProgress(currentChecks);
        }

        function renderRoutineList(checks, focusIndex) {
            const list = document.getElementById('routine-list');
            if (!list) return;
            
            list.innerHTML = routineData.map((item, idx) => {
                const isChecked = !!checks[item.id];
                const isCurrent = idx === focusIndex;
                
                let containerClass = "relative z-10 flex gap-5 items-start transition-all cursor-pointer";
                let iconWrapperClass = "w-14 h-14 rounded-2xl flex items-center justify-center flex-shrink-0 border-4 border-white shadow-sm z-10";
                let textOpacity = isChecked ? "opacity-40" : "opacity-100";
                
                if (isCurrent && !isChecked) iconWrapperClass += " bg-indigo-500 text-white pulse-soft active-ring shadow-indigo-100 shadow-xl";
                else if (isChecked) iconWrapperClass += " bg-emerald-100 text-emerald-600";
                else iconWrapperClass += " bg-white text-slate-300";

                const checkboxHtml = isChecked 
                    ? `<div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white text-[10px] shadow-sm"><i class="fa-solid fa-check"></i></div>` 
                    : `<div class="w-6 h-6 rounded-full border-2 border-slate-300 bg-slate-50"></div>`;

                return `
                    <div class="${containerClass}" onclick="toggleTask(${item.id})">
                        <div class="${iconWrapperClass}">
                            <i class="fa-solid ${item.icon} text-lg"></i>
                        </div>
                        <div class="pt-2 flex-grow ${textOpacity}">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${item.label}</span>
                                ${isCurrent && !isChecked ? '<span class="text-[8px] font-black px-2 py-0.5 rounded-full bg-indigo-600 text-white uppercase">Now</span>' : ''}
                            </div>
                            <h4 class="text-sm font-extrabold text-slate-800">${item.task}</h4>
                            <p class="text-xs text-slate-400 font-medium">${item.detail}</p>
                        </div>
                        <div class="pt-3 pr-2">
                             ${checkboxHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLogs(logs) {
            const list = document.getElementById('log-list');
            if (!list) return;
            
            if (!logs.length) {
                list.innerHTML = '<p class="text-center py-12 text-slate-300 text-xs font-bold uppercase tracking-widest">No Events Yet</p>';
                return;
            }
            list.innerHTML = logs.map(log => {
                const time = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                return `<div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 flex justify-between items-center fade-in">
                    <p class="text-xs font-extrabold text-slate-700">${log.text}</p>
                    <span class="text-[10px] font-mono text-slate-400 font-bold bg-slate-50 px-2 py-1 rounded-lg">${time}</span>
                </div>`;
            }).join('');
        }

        function updateProgress(checks) {
            const completed = Object.values(checks).filter(v => v).length;
            const percent = Math.round((completed / routineData.length) * 100);
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            if (progressBar) progressBar.style.width = percent + '%';
            if (progressText) progressText.innerText = percent + '%';
        }

        // --- View Transitions ---
        window.switchTab = (tab) => {
            const tabs = ['routine', 'logs', 'settings'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    if (btn) btn.classList.add('tab-active');
                    if (btn) btn.classList.remove('text-slate-400');
                    if (view) view.classList.remove('hidden');
                } else {
                    if (btn) btn.classList.remove('tab-active');
                    if (btn) btn.classList.add('text-slate-400');
                    if (view) view.classList.add('hidden');
                }
            });
        };

        function updateStatusBadge(connected, type = 'ready') {
            const badge = document.getElementById('firebase-status');
            const text = document.getElementById('fb-status-text');
            if (!badge || !text) return;
            
            if (type === 'syncing') {
                badge.className = 'w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.5)] animate-pulse';
                text.innerText = 'Syncing...';
            } else if (connected) {
                badge.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]';
                text.innerText = 'Connected';
            } else {
                badge.className = 'w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]';
                text.innerText = 'Offline';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            t.classList.add('opacity-100', 'translate-y-[-10px]');
            setTimeout(() => {
                t.classList.add('opacity-0', 'pointer-events-none');
                t.classList.remove('opacity-100', 'translate-y-[-10px]');
            }, 2000);
        }

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById('live-clock');
            const dateEl = document.getElementById('live-date');
            
            if (clockEl) clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            if (dateEl) dateEl.innerText = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', weekday: 'short' });
            
            const currentStr = now.toISOString().split('T')[0];
            if (activeDate !== currentStr) {
                activeDate = currentStr;
                setupRealtimeSync();
            }
            updateUI();
        }

        initAuth();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
